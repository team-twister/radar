<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoM Live Test</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--fg:#fff;--muted:#8e8e93;--ok:#30d158;--bad:#ff453a;--mid:#ffd60a;--accent:#5ac8fa;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;margin:0;padding:20px 16px 40px;max-width:640px;margin-inline:auto}
h1{font-size:1.3rem;margin:0 0 4px}
p{color:var(--muted);margin:0 0 16px}
.row{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row b{display:block;margin-bottom:3px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mid{color:var(--mid)}.wait{color:var(--muted)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pic{position:relative;background:#0d1620;border-radius:10px;overflow:hidden;aspect-ratio:1}
.pic img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic span{position:absolute;left:8px;top:6px;font-size:.75rem;color:var(--muted);background:rgba(0,0,0,.6);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<h1>BoM live radar test</h1>
<p>Checks what your website can load straight from the Bureau of Meteorology, with no relay. Wait until every line finishes, then screenshot the whole page (it may take two screenshots).</p>
<div id="out"></div>
<div class="pics">
  <div class="pic"><img id="picV" alt="Latest Doppler wind image"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="none" stroke="#5ac8fa" stroke-width=".6" stroke-dasharray="2 1.5"/></svg><span>Doppler wind (latest)</span></div>
  <div class="pic"><img id="picZ" alt="Latest 128 km reflectivity image"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="none" stroke="#5ac8fa" stroke-width=".6" stroke-dasharray="2 1.5"/></svg><span>128 km reflectivity</span></div>
</div>
<script>
const out=document.getElementById('out');
const RID='66';                                   // Brisbane (Mt Stapylton)
const pad=n=>String(n).padStart(2,'0');
const stamp=d=>`${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}`;
function row(title){const d=document.createElement('div');d.className='row';d.innerHTML=`<b>${title}</b><span class="wait">Testing…</span>`;out.appendChild(d);return d.querySelector('span')}
function set(s,cls,text){s.className=cls;s.textContent=text}
function img(url,{cors=false,noRef=true,timeout=8000}={}){
  return new Promise(res=>{const im=new Image();if(cors)im.crossOrigin='anonymous';if(noRef)im.referrerPolicy='no-referrer';
    const t=setTimeout(()=>{im.src='';res(null)},timeout);
    im.onload=()=>{clearTimeout(t);res(im)};im.onerror=()=>{clearTimeout(t);res(null)};im.src=url});
}
function readable(im){try{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>0)n++;return{n,total:d.length/4}}catch(e){return null}}
const wmts=(z,r,c,t)=>`https://api.bom.gov.au/apikey/v1/mapping/timeseries/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=atm_surf_air_precip_reflectivity_dbz&STYLE=default&FORMAT=image/png&TILEMATRIXSET=GoogleMapsCompatible_BoM&TILEMATRIX=${z}&TILEROW=${r}&TILECOL=${c}&time=${t}`;
(async()=>{
  /* 1. BoM map tiles (the new website's radar) */
  let s=row('1. BoM map tile as a normal picture');
  let tileT=null,tileImg=null;
  for(let k=2;k<10&&!tileImg;k++){const d=new Date(Math.floor(Date.now()/3e5)*3e5-k*3e5);const iso=d.toISOString().replace(/\.\d{3}Z$/,'Z');
    const im=await img(wmts(0,0,0,iso),{timeout:6000});if(im){tileImg=im;tileT=iso}}
  set(s,tileImg?'ok':'bad',tileImg?`WORKS: loaded the ${tileT} frame (${tileImg.naturalWidth}×${tileImg.naturalHeight})`:'BLOCKED: no tile would load');
  s=row('2. BoM map tile, readable by the app (needed for 3D)');
  if(tileT){const im=await img(wmts(0,0,0,tileT),{cors:true});const r=im&&readable(im);
    set(s,r?'ok':'bad',r?`WORKS: the app can read its colours (${r.n} rain pixels)`:'NO: shows as a picture only, the app cannot read it')}else set(s,'bad','Skipped (test 1 failed)');

  /* 3–5. Doppler wind (velocity) */
  s=row('3. Latest Doppler wind picture (velocity)');
  const urls=[`https://www.bom.gov.au/radar/IDR${RID}I.gif`,`https://reg.bom.gov.au/radar/IDR${RID}I.gif`];
  let latest=null,base=null;
  for(const u of urls){latest=await img(u);if(latest){base=u.split('/radar/')[0];break}}
  if(latest){document.getElementById('picV').src=latest.src;set(s,'ok',`WORKS from ${base.replace('https://','')} (${latest.naturalWidth}×${latest.naturalHeight})`)}
  else{const withRef=await img(urls[0],{noRef:false});set(s,withRef?'mid':'bad',withRef?'Only works when the page sends its address (referrer)':'BLOCKED: BoM would not serve it to the website')}
  s=row('4. Doppler wind frames (for a loop)');
  const found=[];
  if(base){const now=Math.floor(Date.now()/6e4)*6e4;const jobs=[];
    for(let m=1;m<=40;m++){const d=new Date(now-m*6e4);jobs.push(img(`${base}/radar/IDR${RID}I.T.${stamp(d)}.png`,{timeout:7000}).then(im=>{if(im)found.push({t:d,im})}))}
    await Promise.all(jobs);found.sort((a,b)=>b.t-a.t)}
  if(found.length){const gaps=found.slice(0,-1).map((f,i)=>Math.round((f.t-found[i+1].t)/6e4));
    set(s,'ok',`WORKS: ${found.length} frames in the last 40 min, newest ${Math.round((Date.now()-found[0].t)/6e4)} min old, every ${gaps.join('/')||'?'} min, ${found[0].im.naturalWidth}×${found[0].im.naturalHeight}`)}
  else set(s,base?'bad':'bad',base?'NONE found: the frame names may have changed':'Skipped (test 3 failed)');
  s=row('5. Doppler wind, readable by the app (needed to decode m/s)');
  if(found.length){const im=await img(found[0].im.src,{cors:true});const r=im&&readable(im);
    set(s,r?'ok':'bad',r?`WORKS: the app can read its colours (${r.n} coloured pixels)`:'NO: picture only')}else set(s,'bad','Skipped');

  /* 6–7. 128 km reflectivity frames (old-style images) */
  s=row('6. 128 km reflectivity frames');
  const zf=[];
  if(base){const now=Math.floor(Date.now()/6e4)*6e4;const jobs=[];
    for(let m=1;m<=25;m++){const d=new Date(now-m*6e4);jobs.push(img(`${base}/radar/IDR${RID}3.T.${stamp(d)}.png`,{timeout:7000}).then(im=>{if(im)zf.push({t:d,im})}))}
    await Promise.all(jobs);zf.sort((a,b)=>b.t-a.t)}
  if(zf.length){document.getElementById('picZ').src=zf[0].im.src;const im=await img(zf[0].im.src,{cors:true});const r=im&&readable(im);
    set(s,'ok',`WORKS: ${zf.length} frames, newest ${Math.round((Date.now()-zf[0].t)/6e4)} min old, ${zf[0].im.naturalWidth}×${zf[0].im.naturalHeight}. Readable by the app: ${r?'YES':'no'}`)}
  else set(s,'bad',base?'NONE found':'Skipped');

  s=row('7. Your phone');
  set(s,'wait',navigator.userAgent.replace(/^Mozilla\/5\.0 /,''));
})();
</script>
</body>
</html>
