<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive Access Test</title>
<style>
:root{--bg:#05080c;--fg:#dce6ee;--muted:#8696a5;--ok:#4fd27a;--bad:#ff6b6b;--line:#253445;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px ui-sans-serif,system-ui,sans-serif;margin:0;padding:24px 16px;max-width:640px;margin-inline:auto}
h1{font-size:1.2rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 18px;line-height:1.45}
.row{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row b{display:block;margin-bottom:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wait{color:var(--muted)}
code{font-size:.8rem;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
<h1>Radar archive access test</h1>
<p>Checks whether this website can read the BoM radar archive directly, with no relay. Screenshot this page once every line has finished.</p>
<div id="out"></div>
<script>
const TESTS=[
  ['1. Archive catalogue page','https://thredds.nci.org.au/thredds/catalog/rq0/66/2025/vol/catalog.xml',{}],
  ['2. Grab part of a day file (single-scan trick)','https://thredds.nci.org.au/thredds/fileServer/rq0/66/2025/vol/66_20251026.pvol.zip',{headers:{Range:'bytes=-65536'}}],
  ['3. Gridded 3D product folder (level 1b)','https://thredds.nci.org.au/thredds/catalog/rq0/level_1b/catalog.xml',{}],
  ['4. BoM live tiles','https://api.bom.gov.au/apikey/v1/mapping/timeseries/wmts/1.0.0/WMTSCapabilities.xml',{}],
];
const out=document.getElementById('out');
(async()=>{
  for(const[name,url,opt]of TESTS){
    const d=document.createElement('div');d.className='row';d.innerHTML=`<b>${name}</b><span class="wait">Testing…</span><br><code>${url}</code>`;out.appendChild(d);
    const s=d.querySelector('span');
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),20000);
      const r=await fetch(url,{...opt,signal:ctl.signal});clearTimeout(to);
      const buf=await r.arrayBuffer();
      const range=r.headers.get('Content-Range');
      const good=r.ok&&(!opt.headers||r.status===206);
      s.className=good?'ok':'bad';
      s.textContent=`${good?'WORKS':'Partly'}: status ${r.status}, read ${buf.byteLength.toLocaleString()} bytes${range?', range '+range:''}`;
    }catch(e){s.className='bad';s.textContent=`BLOCKED: ${e.name==='AbortError'?'timed out':'the server does not allow websites to read it (CORS)'}`}
  }
})();
</script>
</body>
</html>
