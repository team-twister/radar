<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06090d">
<title>Live Radar Stack</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen map; slim header top; tool buttons top-right; collapsible control dock at the bottom */
:root{
  --bg:#06090d; --panel:rgba(12,18,26,.9); --line:#253445; --fg:#dce6ee; --muted:#8696a5; --accent:#4fd2e8; --warn:#f2b84b; --live:#ff5a5a;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px var(--body);overflow:hidden}
[hidden]{display:none!important}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:10px}
header{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:18px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  background:linear-gradient(rgba(6,9,13,.92) 55%,transparent)}
header > *{pointer-events:auto}
.brand{display:grid;gap:3px;min-width:0}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
h1 span{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,90,.6)}70%{box-shadow:0 0 0 8px rgba(255,90,90,0)}100%{box-shadow:0 0 0 0 rgba(255,90,90,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.meta{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.02em;line-height:1.4}
.meta b{color:var(--fg);font-weight:500}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{font:600 .74rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;backdrop-filter:blur(6px)}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.status{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top,0px));
  font:500 .74rem var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 11px;max-width:calc(100% - 32px);text-align:center}
.status.err{border-color:var(--warn);color:var(--warn)}
.dock{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px)}
.dock-head{display:flex;align-items:center;gap:8px;padding:9px 12px}
.seg{display:flex;flex:1;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:600 .72rem var(--body);color:var(--muted);background:transparent;border:0;padding:8px 4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(79,210,232,.14);color:var(--accent)}
.seg button+button{border-left:1px solid var(--line)}
.fold{font:600 .72rem var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.dock-body{display:grid;gap:10px;padding:0 12px 12px;max-height:42vh;overflow-y:auto}
.frames{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.frame{flex:0 0 auto;font:500 .64rem var(--mono);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:5px;padding:4px 6px;cursor:pointer;font-variant-numeric:tabular-nums}
.frame[aria-pressed="true"]{border-color:var(--accent);background:rgba(79,210,232,.12)}
.frame.newest[aria-pressed="true"]{border-color:var(--live);background:rgba(255,90,90,.12)}
.row{display:grid;grid-template-columns:5.8rem 1fr 3.2rem;align-items:center;gap:8px;font-size:.75rem}
.row label{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.62rem}
.row output{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.row select{font:500 .72rem var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.scale{display:flex;height:8px;border-radius:2px;overflow:hidden}
.scale i{flex:1}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-top:3px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{font:500 .7rem var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.btns button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.credit{font-size:.6rem;color:var(--muted);line-height:1.4}
/* radar site markers */
.site{background:none;border:0;padding:0;font:inherit;color:inherit;display:flex;align-items:center;gap:5px;cursor:pointer;transform:translateY(1px)}
.site i{width:11px;height:11px;transform:rotate(45deg);background:#0b1118;border:2px solid #e8eef3;display:block}
.site span{font:600 10.5px var(--body);color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.site.dop i{border-color:var(--accent)}
.site.active i{background:var(--live);border-color:#fff;width:13px;height:13px}
.site.active span{color:var(--live)}
#map.far .site:not(.active) span{display:none}
.keyrow{display:flex;gap:12px;font-size:.62rem;color:var(--muted);align-items:center}
.keyrow i{display:inline-block;width:8px;height:8px;transform:rotate(45deg);border:2px solid #e8eef3;margin-right:5px}
.keyrow i.d{border-color:var(--accent)}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="brand">
    <h1><i class="dot" aria-hidden="true"></i>Live <span>Radar Stack</span></h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div class="tools">
    <button class="tbtn" id="sitesBtn" aria-pressed="false">Radar sites</button>
    <button class="tbtn" id="styleBtn">Dark map</button>
  </div>
</header>
<div class="status" id="status" hidden></div>

<div class="dock">
  <div class="dock-head">
    <div class="seg" role="group" aria-label="Display mode">
      <button id="modeSep" aria-pressed="false">Separated</button>
      <button id="mode3d" aria-pressed="true">3D stack</button>
      <button id="modeNow" aria-pressed="false">Latest</button>
    </div>
    <button class="fold" id="fold" aria-expanded="true">Hide</button>
  </div>
  <div class="dock-body" id="dockBody">
    <div class="frames" id="frames" aria-label="Radar frames; tap to hide or show one"></div>
    <div class="row"><label for="gap">Layer gap</label><input id="gap" type="range" min="0" max="10" step="0.5" value="1"><output id="gapv">1</output></div>
    <div class="row"><label for="min">Min dBZ</label><input id="min" type="range" min="10" max="55" value="14"><output id="minv">14</output></div>
    <div class="row"><label for="float">Float height</label><input id="float" type="range" min="0" max="20" value="6"><output id="floatv">6</output></div>
    <div class="row"><label for="count">Frames</label><select id="count"><option value="6">6</option><option value="12" selected>12</option><option value="18">18</option></select><span></span></div>
    <div>
      <div class="scale" id="scale"></div>
      <div class="ticks"><span>15</span><span>25</span><span>35</span><span>45</span><span>55</span><span>65 dBZ</span></div>
    </div>
    <div class="btns">
      <button id="smooth" aria-pressed="true">Smooth storms</button>
      <button id="spin" aria-pressed="false">Auto-rotate</button>
      <button id="reset">Reset view</button>
      <button id="aus">All of Australia</button>
      <button id="refresh">Refresh now</button>
    </div>
    <div class="keyrow"><span><i class="d"></i>Doppler radar</span><span><i></i>Rain-only radar</span></div>
    <div class="credit" id="credit">Each layer is one radar frame, oldest at the bottom. Radar © Commonwealth of Australia, Bureau of Meteorology. Personal use only.</div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ================= settings ================= */
const HALF=20037508.342789244, WORLD=HALF*2, R_EARTH=6378137;
const RANGE_KM=256;
const DEFAULTS={mode:'3d',gap:1,min:14,float:6,count:12,dark:false,smooth:true,site:'Brisbane (Mt Stapylton)'};
const VX=4;                   // vertical exaggeration so layers read at map scale
const GAP_UNIT=2500*VX;       // metres of height per "layer gap" step
const MAX_H=14000*VX;         // tallest block in 3D stack / latest mode (metres)
const SITES=[
['Brewarrina','NSW',-29.970778,146.813528,1],['Canberra (Captains Flat)','NSW',-35.661444,149.51225,1],['Grafton','NSW',-29.620639,152.96333,0],['Hillston','NSW',-33.552194,145.52861,1],['Moree','NSW',-29.49025,149.846194,0],['Namoi (Blackjack Mtn)','NSW',-31.024222,150.19194,1],['Newcastle','NSW',-32.729778,152.025417,1],['Norfolk Island','NI',-29.038222,167.941361,0],['Sydney (Terrey Hills)','NSW',-33.70083,151.209417,1],['Wagga Wagga','NSW',-35.158139,147.456306,0],['Wollongong (Appin)','NSW',-34.262333,150.875111,1],['Yeoval','NSW',-32.744472,148.708083,1],
['Alice Springs','NT',-23.795056,133.888917,0],['Darwin (Berrimah)','NT',-12.455889,130.926556,1],['Darwin Airport','NT',-12.424611,130.892083,1],['Gove','NT',-12.268917,136.820333,1],['Katherine (Tindal)','NT',-14.512361,132.443139,0],['Warruwi','NT',-11.648472,133.379972,1],
['Bowen','QLD',-19.88575,148.075667,0],['Brisbane (Mt Stapylton)','QLD',-27.717722,153.24,1],['Cairns','QLD',-16.818167,145.663028,1],['Emerald','QLD',-23.549556,148.23917,1],['Gladstone','QLD',-23.855111,151.2625,0],['Greenvale','QLD',-18.997639,144.995861,1],['Gympie (Mt Kanigan)','QLD',-25.957333,152.576917,1],['Longreach','QLD',-23.439778,144.28225,0],['Mackay','QLD',-21.11725,149.217278,1],['Marburg','QLD',-27.606278,152.540083,1],['Mornington Island','QLD',-16.664111,139.181222,0],['Mount Isa','QLD',-20.711194,139.55528,1],['Richmond','QLD',-20.75175,143.141444,1],['Taroom','QLD',-25.696167,149.898167,1],['Toowoomba','QLD',-27.274194,151.993111,1],['Townsville (Hervey Range)','QLD',-19.419778,146.550944,1],['Warrego','QLD',-26.440167,147.349111,0],['Weipa','QLD',-12.666417,141.924639,1],['Willis Island','QLD',-16.287417,149.964583,1],
['Adelaide (Buckland Park)','SA',-34.617,138.46875,1],['Adelaide (Sellicks Hill)','SA',-35.329528,138.5025,0],['Ceduna','SA',-32.129833,133.696361,1],['Mt Gambier','SA',-37.747694,140.774611,0],['Woomera','SA',-31.155806,136.804389,0],
['Hobart (Mt Koonya)','TAS',-43.112611,147.805222,1],['Hobart Airport','TAS',-42.837361,147.500861,0],['NW Tasmania (West Takone)','TAS',-41.17917,145.579972,1],
['Bairnsdale','VIC',-37.887528,147.5755,0],['Melbourne','VIC',-37.855222,144.755417,1],['Melbourne (Broadmeadows)','VIC',-37.689861,144.94722,1],['Mildura','VIC',-34.287111,141.598194,1],['Rainbow','VIC',-35.997556,142.013306,1],['Yarrawonga','VIC',-36.029639,146.02275,1],
['Albany','WA',-34.941806,117.816361,1],['Broome','WA',-17.94825,122.235333,1],['Carnarvon','WA',-24.887972,113.669361,0],['Dampier','WA',-20.653528,116.683278,1],['Esperance','WA',-33.830139,121.891722,1],['Geraldton','WA',-28.804667,114.697333,1],['Giles','WA',-25.033222,128.301722,0],['Halls Creek','WA',-18.228917,127.662806,0],['Kalgoorlie','WA',-30.784222,121.454833,1],['Karratha','WA',-20.991472,116.87583,1],['Learmonth','WA',-22.103167,113.999639,0],['Newdegate','WA',-33.09694,119.008778,1],['Perth (Serpentine)','WA',-32.39175,115.86694,1],['Perth Airport','WA',-31.927278,115.97556,0],['Port Hedland','WA',-20.371861,118.63167,0],['South Doodlakine','WA',-31.77778,117.95278,1],['Watheroo','WA',-30.360194,116.289694,1],['Wyndham','WA',-15.451694,128.12083,0]
];

/* ---- display colours (RadarScope-like) ---- */
const STOPS=[[10,[150,150,160]],[14,[110,170,190]],[18,[92,157,174]],[20,[39,169,67]],[25,[24,131,35]],[30,[35,115,8]],[33,[155,191,3]],[35,[244,243,0]],[40,[204,188,0]],[41,[238,138,1]],[49,[196,104,8]],[50,[249,35,11]],[58,[148,39,28]],[60,[200,133,169]],[65,[196,67,134]],[66,[154,36,224]],[72,[105,24,179]]];
function col(z){
  if(z<=STOPS[0][0])return STOPS[0][1];
  for(let i=1;i<STOPS.length;i++){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i];if(z<=b){const t=(z-a)/(b-a);return ca.map((v,k)=>v+(cb[k]-v)*t)}}
  return STOPS[STOPS.length-1][1];
}
const hex=z=>'#'+col(z).map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');

/* ---- colour -> dBZ decoders ---- */
function makeLUT(ramp){ // ramp: [[dbz,r,g,b],...]; returns 32^3 lookup of nearest dBZ (or -999)
  const lut=new Int16Array(32768);
  for(let k=0;k<32768;k++){
    const r=((k>>10)<<3)+4,g=(((k>>5)&31)<<3)+4,b=((k&31)<<3)+4;let best=-999,bd=1600;
    for(const[d,R,G,B]of ramp){const dd=(r-R)**2+(g-G)**2+(b-B)**2;if(dd<bd){bd=dd;best=d}}
    lut[k]=best;
  }
  return lut;
}
function densify(bands){ // interpolate 1-dBZ steps between band midpoints (BoM tiles are cubic-resampled)
  const out=[];
  for(let i=0;i<bands.length-1;i++){const[a,...ca]=bands[i],[b,...cb]=bands[i+1];
    for(let d=a;d<b;d+=0.5){const t=(d-a)/(b-a);out.push([Math.round(d),...ca.map((v,k)=>v+(cb[k]-v)*t)])}}
  out.push(bands.at(-1));return out;
}
// BoM "precip_reflectivity_dbz_cubic" bands at their midpoints
const BOM_BANDS=[[17,245,245,255],[25,180,180,255],[29,120,120,255],[32,20,20,255],[35,0,216,195],[38,0,150,144],[41,0,102,102],[44,255,255,0],[47,255,200,0],[50,255,150,0],[53,255,100,0],[56,255,0,0],[59,200,0,0],[62,120,0,0],[66,40,0,0]];
// RainViewer Universal Blue (rain), every 1 dBZ from 15
const RV_HEX='15:88ddee,16:6cd1eb,17:51c5e8,18:36bae5,19:1baee2,20:00a3e0,21:009ad5,22:0091ca,23:0088bf,24:007fb4,25:0077aa,26:0070a3,27:00699c,28:006295,29:005b8e,30:005588,31:005180,32:004e78,33:004a70,34:004768,35:ffee00,36:ffe000,37:ffd200,38:ffc500,39:ffb700,40:ffaa00,41:ff9f00,42:ff9500,43:ff8b00,44:ff8100,45:ff4400,46:f23600,47:e62800,48:d91b00,49:cd0d00,50:c10000,51:a80000,52:8f0000,53:760000,54:5d0000,55:ffaaff,56:ff9fff,57:ff95ff,58:ff8bff,59:ff81ff,60:ff77ff,61:ff6cff,62:ff62ff,63:ff58ff,64:ff4eff,65:ffffff';
const RV_RAMP=RV_HEX.split(',').map(s=>{const[d,h]=s.split(':');return[+d,parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]});
let BOM_LUT=null,RV_LUT=null;

/* ---- data sources ---- */
const SOURCES={
  bom:{
    name:'BoM',z:7,tlx:11584952,tly:-583562.846447,w:22,h:17,step:5,
    url:(c,r,t)=>`https://api.bom.gov.au/apikey/v1/mapping/timeseries/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=atm_surf_air_precip_reflectivity_dbz&STYLE=default&FORMAT=image/png&TILEMATRIXSET=GoogleMapsCompatible_BoM&TILEMATRIX=7&TILEROW=${r}&TILECOL=${c}&time=${t}`,
    lut:()=>BOM_LUT||(BOM_LUT=makeLUT(densify(BOM_BANDS))),
    async times(n){
      const iso=d=>d.toISOString().replace(/\.\d{3}Z$/,'Z');
      let t=Math.floor((Date.now()-10*60e3)/(5*60e3))*5*60e3;
      for(let k=0;k<8;k++){ // find newest available frame
        const ok=await probe(`https://api.bom.gov.au/apikey/v1/mapping/timeseries/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=atm_surf_air_precip_reflectivity_dbz&STYLE=default&FORMAT=image/png&TILEMATRIXSET=GoogleMapsCompatible_BoM&TILEMATRIX=0&TILEROW=0&TILECOL=0&time=${iso(new Date(t))}`);
        if(ok)break;t-=5*60e3;
      }
      return Array.from({length:n},(_,i)=>{const d=new Date(t-(n-1-i)*5*60e3);return{time:d.getTime()/1000,key:iso(d)}});
    }
  },
  rv:{
    name:'RainViewer',z:7,tlx:-HALF,tly:HALF,w:128,h:128,step:10,host:'',
    url:(c,r,t)=>`${SOURCES.rv.host}${t}/256/7/${c}/${r}/2/0_0.png`,
    lut:()=>RV_LUT||(RV_LUT=makeLUT(RV_RAMP)),
    async times(n){
      const res=await fetch('https://api.rainviewer.com/public/weather-maps.json',{cache:'no-store'});
      if(!res.ok)throw new Error('RainViewer did not answer');
      const j=await res.json();SOURCES.rv.host=j.host;
      return (j.radar&&j.radar.past||[]).slice(-n).map(p=>({time:p.time,key:p.path}));
    }
  }
};

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem('lrs2-'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('lrs2-'+k,JSON.stringify(v))}catch(e){}}};
const st={...DEFAULTS};for(const k of Object.keys(DEFAULTS)){const v=store.get(k);if(v!==null&&v!==undefined)st[k]=v}
function status(msg,err){const s=$('status');if(!msg){s.hidden=true;return}s.hidden=false;s.textContent=msg;s.classList.toggle('err',!!err)}
const lon2x=lon=>lon*Math.PI/180*R_EARTH, lat2y=lat=>R_EARTH*Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
const x2lon=x=>x/R_EARTH*180/Math.PI, y2lat=y=>(2*Math.atan(Math.exp(y/R_EARTH))-Math.PI/2)*180/Math.PI;
function probe(url){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';const to=setTimeout(()=>res(false),4000);im.onload=()=>{clearTimeout(to);res(true)};im.onerror=()=>{clearTimeout(to);res(false)};im.src=url})}
function loadImage(url){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=url})}
function circle(lat,lon,km,n=96){const pts=[];for(let i=0;i<=n;i++){const a=i/n*2*Math.PI,dlat=km/111.32*Math.cos(a),dlon=km/(111.32*Math.cos(lat*Math.PI/180))*Math.sin(a);pts.push([lon+dlon,lat+dlat])}return pts}

/* ================= map ================= */
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const map=new maplibregl.Map({
  container:'map',
  style:{version:8,sources:{
      sat:{type:'raster',tiles:[ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:18,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'},
      dark:{type:'raster',tiles:[ESRI+'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:16,attribution:'Basemap © Esri, HERE, Garmin, OpenStreetMap contributors'},
      labels:{type:'raster',tiles:[ESRI+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:18}
    },layers:[
      {id:'bg',type:'background',paint:{'background-color':'#06090d'}},
      {id:'sat',type:'raster',source:'sat',paint:{'raster-brightness-max':0.75,'raster-saturation':-0.25}},
      {id:'dark',type:'raster',source:'dark',layout:{visibility:'none'}},
      {id:'labels',type:'raster',source:'labels',paint:{'raster-opacity':0.8}}
    ]},
  bounds:[[112,-44.5],[154.5,-9.5]],fitBoundsOptions:{padding:20},
  maxBounds:[[95,-55],[175,0]],
  pitch:0,maxPitch:75,attributionControl:{compact:true}
});

let rawByFrame=[],cleanByFrame=[],siteMarkers=[],activeSite=null,frames=[],frameOn=[],cellsByFrame=[],grid=null,busy=false,lastKey='',spinning=false,currentSource='bom';

map.on('load',()=>{
  map.addSource('ring',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'ring',type:'line',source:'ring',paint:{'line-color':'#4fd2e8','line-width':1.4,'line-opacity':0.7,'line-dasharray':[3,2]}});
  map.addSource('shadow',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'shadow',type:'fill',source:'shadow',paint:{'fill-color':'#000','fill-opacity':0.38}});
  map.addSource('storm',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'storm',type:'fill-extrusion',source:'storm',paint:{
    'fill-extrusion-color':['get','c'],'fill-extrusion-base':['get','b'],'fill-extrusion-height':['get','h'],
    'fill-extrusion-opacity':0.92,'fill-extrusion-vertical-gradient':true}});
  applyStyle();buildSiteMarkers();
  const s=SITES.find(x=>x[0]===st.site)||SITES.find(x=>x[0]===DEFAULTS.site);
  selectSite(s,{fly:true,first:true});
});

/* ---- radar site markers ---- */
function buildSiteMarkers(){
  for(const s of SITES){
    const el=document.createElement('button');el.className='site'+(s[4]?' dop':'');el.type='button';
    el.setAttribute('aria-label',`${s[0]} radar, ${s[1]}`);
    el.innerHTML=`<i></i><span>${s[0]}</span>`;
    el.onclick=e=>{e.stopPropagation();selectSite(s,{fly:true})};
    const m=new maplibregl.Marker({element:el,anchor:'left',offset:[-7,0]}).setLngLat([s[3],s[2]]);
    siteMarkers.push({s,m,el});
  }
  showSites(false);
}
function showSites(on){
  $('sitesBtn').setAttribute('aria-pressed',on);
  siteMarkers.forEach(({s,m})=>{const keep=on||s===activeSite;if(keep)m.addTo(map);else m.remove()});
}
function selectSite(s,{fly,first}={}){
  activeSite=s;st.site=s[0];store.set('site',s[0]);
  siteMarkers.forEach(o=>o.el.classList.toggle('active',o.s===s));
  showSites($('sitesBtn').getAttribute('aria-pressed')==='true');
  map.getSource('ring').setData({type:'Feature',geometry:{type:'LineString',coordinates:circle(s[2],s[3],RANGE_KM)}});
  if(fly)home(first?1800:1200);
  update(true);
}
function home(duration=1000){
  if(!activeSite)return;
  const s=activeSite,ring=circle(s[2],s[3],RANGE_KM*0.9,24);
  const lons=ring.map(p=>p[0]),lats=ring.map(p=>p[1]);
  const narrow=innerWidth<600;
  const dockH=document.querySelector('.dock').getBoundingClientRect().height;
  const cam=map.cameraForBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],{padding:{top:110,bottom:Math.min(dockH+20,innerHeight*0.5),left:narrow?0:60,right:narrow?0:60}});
  map.easeTo({...cam,pitch:st.mode==='sep'?62:55,bearing:-15,duration});
}

/* ================= live data ================= */
async function grabFrame(src,key,c0,c1,r0,r1){
  const cv=document.createElement('canvas');cv.width=(c1-c0+1)*256;cv.height=(r1-r0+1)*256;
  const ctx=cv.getContext('2d',{willReadFrequently:true});let ok=0;
  const jobs=[];
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)jobs.push(loadImage(src.url(c,r,key)).then(im=>{if(im){ctx.drawImage(im,(c-c0)*256,(r-r0)*256);ok++}}));
  await Promise.all(jobs);
  let data;try{data=ctx.getImageData(0,0,cv.width,cv.height).data}catch(e){throw new Error('blocked')}
  return {data,ok,total:jobs.length,W:cv.width};
}
function cellsFrom(img,src,g){
  const lut=src.lut(),{data,W}=img,{B,nx,ny,ox,oy,inRing}=g,cells=[],vals=[];
  for(let gy=0;gy<ny;gy++)for(let gx=0;gx<nx;gx++){
    if(!inRing[gy*nx+gx])continue;
    vals.length=0;
    for(let y=oy+gy*B;y<oy+gy*B+B;y++)for(let x=ox+gx*B;x<ox+gx*B+B;x++){
      const o=(y*W+x)*4;if(data[o+3]<128)continue;
      const d=lut[((data[o]>>3)<<10)|((data[o+1]>>3)<<5)|(data[o+2]>>3)];if(d>-999)vals.push(d);
    }
    if(vals.length<B*B*0.3)continue;
    vals.sort((a,b)=>a-b);cells.push([gx,gy,vals[Math.min(vals.length-1,Math.floor(vals.length*0.7))]]);
  }
  return cells;
}
/* tidy a frame: drop speckle, fill pin-holes, smooth noise, so storms read as solid shapes */
function cleanCells(cells,g){
  const {nx,ny}=g,N=nx*ny;let v=new Float32Array(N).fill(NaN);
  for(const[x,y,d]of cells)v[y*nx+x]=d;
  const at=(a,x,y)=>(x<0||y<0||x>=nx||y>=ny)?NaN:a[y*nx+x];
  for(let pass=0;pass<2;pass++){           // speckle out, holes in
    const nv=v.slice();
    for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){
      let n=0,sum=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const q=at(v,x+dx,y+dy);if(q===q){n++;sum+=q}}
      const k=y*nx+x;
      if(v[k]===v[k]){if(n<3)nv[k]=NaN}else if(n>=6)nv[k]=sum/n;
    }
    v=nv;
  }
  const out=[],W=[1,2,1,2,4,2,1,2,1];       // gentle 3x3 blur over rain cells only
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){
    if(v[y*nx+x]!==v[y*nx+x])continue;
    let s=0,w=0,i=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++,i++){const q=at(v,x+dx,y+dy);if(q===q){s+=q*W[i];w+=W[i]}}
    out.push([x,y,Math.round(s/w)]);
  }
  return out;
}
function makeGrid(src,s){
  const span=WORLD/2**src.z,res=span/256,B=4;
  const mx=lon2x(s[3]),my=lat2y(s[2]),Rm=RANGE_KM*1000/Math.cos(s[2]*Math.PI/180);
  const clampC=v=>Math.max(0,Math.min(src.w-1,v)),clampR=v=>Math.max(0,Math.min(src.h-1,v));
  const c0=clampC(Math.floor((mx-Rm-src.tlx)/span)),c1=clampC(Math.floor((mx+Rm-src.tlx)/span));
  const r0=clampR(Math.floor((src.tly-(my+Rm))/span)),r1=clampR(Math.floor((src.tly-(my-Rm))/span));
  // pixel origin of the mosaic in mercator
  const X0=src.tlx+c0*span,Y0=src.tly-r0*span;
  // grid covering the ring, aligned to pixels
  const px0=Math.max(0,Math.floor((mx-Rm-X0)/res)),py0=Math.max(0,Math.floor((Y0-(my+Rm))/res));
  const pxw=(c1-c0+1)*256,pyh=(r1-r0+1)*256;
  const nx=Math.floor((Math.min(pxw,Math.ceil((mx+Rm-X0)/res))-px0)/B),ny=Math.floor((Math.min(pyh,Math.ceil((Y0-(my-Rm))/res))-py0)/B);
  const inRing=new Uint8Array(nx*ny);
  for(let gy=0;gy<ny;gy++)for(let gx=0;gx<nx;gx++){
    const cx=X0+(px0+gx*B+B/2)*res,cy=Y0-(py0+gy*B+B/2)*res;
    inRing[gy*nx+gx]=Math.hypot(cx-mx,cy-my)<=Rm?1:0;
  }
  return {c0,c1,r0,r1,B,nx,ny,ox:px0,oy:py0,inRing,X0,Y0,res};
}
function cellPoly(g,gx,gy){
  const x0=g.X0+(g.ox+gx*g.B)*g.res,y0=g.Y0-(g.oy+gy*g.B)*g.res,x1=x0+g.B*g.res,y1=y0-g.B*g.res;
  const a=x2lon(x0),b=x2lon(x1),c=y2lat(y0),d=y2lat(y1);
  return [[[a,c],[b,c],[b,d],[a,d],[a,c]]];
}

async function update(force){
  if(busy){pendingForce=pendingForce||force;return}
  busy=true;const s=activeSite;
  try{
    let src=SOURCES[currentSource],list;
    status(frames.length?null:'Fetching live radar…');
    try{list=await src.times(+st.count)}catch(e){if(currentSource==='bom')throw e;throw new Error('Could not reach the radar feed. Open this page from its web link, with internet on.')}
    const key=`${s[0]}|${st.count}|${currentSource}|${list.at(-1).key}`;
    if(!force&&key===lastKey){stamp();busy=false;return}
    let g=makeGrid(src,s);
    const out=[];
    for(let i=0;i<list.length;i++){
      status(`Loading ${s[0]} · frame ${i+1} of ${list.length}`);
      let img;
      try{img=await grabFrame(src,list[i].key,g.c0,g.c1,g.r0,g.r1)}
      catch(e){img=null}
      if((!img||img.ok===0)&&currentSource==='bom'&&i===list.length-1&&out.every(o=>o.cells.length===0)){
        // BoM tiles unreadable here: switch to RainViewer
        currentSource='rv';busy=false;status('BoM tiles blocked, switching to RainViewer…');return update(true);
      }
      out.push({time:list[i].time,cells:img?cellsFrom(img,src,g):[]});
    }
    grid=g;frames=out;rawByFrame=out.map(f=>f.cells);cleanByFrame=out.map(f=>cleanCells(f.cells,g));cellsByFrame=st.smooth?cleanByFrame:rawByFrame;
    if(frameOn.length!==frames.length)frameOn=frames.map(()=>true);
    lastKey=key;renderChips();redraw();stamp();
    const total=out.reduce((a,f)=>a+f.cells.length,0);
    status(total?null:`No rain within ${RANGE_KM} km of ${s[0]} right now.`);
  }catch(e){status(e&&e.message&&e.message!=='blocked'?e.message:'Could not load radar. Check your internet and tap Refresh.',true)}
  busy=false;
  if(pendingForce!==null){const f=pendingForce;pendingForce=null;update(f)}
}
let pendingForce=null;

/* ---- build the 3D features ---- */
function redraw(){
  if(!grid||!map.getSource('storm'))return;
  const g=grid,feats=[],shadow=[],n=frames.length,floatM=st.float*1000*VX,gapM=st.gap*GAP_UNIT;
  const top=new Float32Array(g.nx*g.ny); // running top per cell (3D stack)
  const shown=frames.map((f,i)=>frameOn[i]&&(st.mode!=='now'||i===n-1));
  let layer=0;
  for(let i=0;i<n;i++){
    if(!shown[i])continue;
    const lvl=floatM+layer*gapM;
    for(const[gx,gy,d]of cellsByFrame[i]){
      if(d<st.min)continue;
      const k=gy*g.nx+gx;let b,h;
      if(st.mode==='sep'){                 // flat slabs, evenly spaced, never merged
        const thick=gapM>0?Math.max(800*VX,gapM*0.4):800*VX;
        b=lvl;h=lvl+thick;
      }else{                               // 3D stack / latest: height = intensity, stacked on what is below
        const dq=st.smooth?Math.floor(d/5)*5+2.5:d;   // 5 dBZ terraces read like storm cores
        const hh=300*VX+Math.max(0,dq-10)/60*(st.mode==='now'?MAX_H:MAX_H*0.45);
        b=Math.max(lvl,top[k]);h=b+hh;top[k]=h;
      }
      feats.push({type:'Feature',properties:{c:hex(st.smooth?Math.floor(d/5)*5+2.5:d),b,h},geometry:{type:'Polygon',coordinates:cellPoly(g,gx,gy)}});
    }
    layer++;
  }
  // ground shadow of the newest visible frame
  const last=[...shown.keys()].reverse().find(i=>shown[i]);
  if(last!==undefined&&floatM>0)for(const[gx,gy,d]of cellsByFrame[last])if(d>=st.min)shadow.push({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:cellPoly(g,gx,gy)}});
  map.getSource('storm').setData({type:'FeatureCollection',features:feats});
  map.getSource('shadow').setData({type:'FeatureCollection',features:shadow});
}
let redrawTimer=null;function redrawSoon(){clearTimeout(redrawTimer);redrawTimer=setTimeout(redraw,120)}

function renderChips(){
  const fr=$('frames');fr.innerHTML='';
  frames.map((f,i)=>[f,i]).reverse().forEach(([f,i])=>{
    const b=document.createElement('button');b.className='frame'+(i===frames.length-1?' newest':'');
    b.setAttribute('aria-pressed',frameOn[i]);
    b.textContent=new Date(f.time*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    b.onclick=()=>{frameOn[i]=!frameOn[i];b.setAttribute('aria-pressed',frameOn[i]);redraw()};
    fr.appendChild(b);
  });
}
function stamp(){
  if(!frames.length)return;
  const t=frames.at(-1).time,ago=Math.max(0,Math.round((Date.now()/1000-t)/60));
  $('meta').innerHTML=`<b>${activeSite[0]}</b> · ${SOURCES[currentSource].name} · newest ${new Date(t*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} (${ago} min ago)`;
}

/* ================= controls ================= */
function setMode(m){st.mode=m;store.set('mode',m);
  [['sep','modeSep'],['3d','mode3d'],['now','modeNow']].forEach(([k,id])=>$(id).setAttribute('aria-pressed',k===m));
  redraw();map.easeTo({pitch:m==='sep'?62:55,duration:600});}
$('modeSep').onclick=()=>setMode('sep');$('mode3d').onclick=()=>setMode('3d');$('modeNow').onclick=()=>setMode('now');
function bindRange(id,key,fmt){const el=$(id),out=$(id+'v');el.value=st[key];out.textContent=fmt(st[key]);
  el.oninput=()=>{st[key]=+el.value;out.textContent=fmt(st[key]);store.set(key,st[key]);redrawSoon()}}
bindRange('gap','gap',v=>v);bindRange('min','min',v=>v);bindRange('float','float',v=>v);
$('count').value=st.count;$('count').onchange=()=>{st.count=+$('count').value;store.set('count',st.count);frameOn=[];update(true)};
$('sitesBtn').onclick=()=>showSites($('sitesBtn').getAttribute('aria-pressed')!=='true');
function applyStyle(){
  map.setLayoutProperty('sat','visibility',st.dark?'none':'visible');
  map.setLayoutProperty('dark','visibility',st.dark?'visible':'none');
  $('styleBtn').textContent=st.dark?'Satellite':'Dark map';
}
$('styleBtn').onclick=()=>{st.dark=!st.dark;store.set('dark',st.dark);applyStyle()};
$('fold').onclick=()=>{const open=$('fold').getAttribute('aria-expanded')!=='true';$('fold').setAttribute('aria-expanded',open);$('fold').textContent=open?'Hide':'Controls';$('dockBody').hidden=!open};
$('reset').onclick=()=>home();
$('smooth').setAttribute('aria-pressed',st.smooth);
$('smooth').onclick=()=>{st.smooth=!st.smooth;store.set('smooth',st.smooth);$('smooth').setAttribute('aria-pressed',st.smooth);cellsByFrame=st.smooth?cleanByFrame:rawByFrame;redraw()};
$('aus').onclick=()=>{showSites(true);if($('fold').getAttribute('aria-expanded')==='true')$('fold').click();map.fitBounds([[112,-44.5],[154.5,-9.5]],{padding:20,pitch:0,bearing:0,duration:1200})};
$('refresh').onclick=()=>{if(currentSource==='rv')currentSource='bom';update(true)};
$('spin').onclick=()=>{spinning=!spinning;$('spin').setAttribute('aria-pressed',spinning);if(spinning)spin()};
function spin(){if(!spinning)return;map.setBearing(map.getBearing()+0.15);requestAnimationFrame(spin)}
map.on('dragstart',()=>{if(spinning){spinning=false;$('spin').setAttribute('aria-pressed',false)}});
setMode(st.mode);
function labelZoom(){$('map').classList.toggle('far',map.getZoom()<5.6)}
map.on('zoomend',labelZoom);map.on('load',labelZoom);
for(let z=15;z<70;z++){const i=document.createElement('i');i.style.background=hex(z);$('scale').appendChild(i)}
setInterval(()=>update(false),5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeSite)update(false)});
</script>
</body>
