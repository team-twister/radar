<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06090d">
<title>Live Radar Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D scene, header with place picker, control dock floating at the bottom */
:root{
  --bg:#06090d; --panel:rgba(14,20,28,.88); --line:#223040; --fg:#dce6ee; --muted:#7d8c9a; --accent:#4fd2e8; --warn:#f2b84b; --live:#ff5a5a;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px var(--body);overflow:hidden}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;touch-action:none;width:100%;height:100%}
header{position:fixed;top:0;left:0;right:0;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(var(--bg) 60%,transparent)}
.brand{display:grid;gap:2px;min-width:0}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h1 span{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(255,90,90,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,90,90,0)}100%{box-shadow:0 0 0 0 rgba(255,90,90,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.meta{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.03em}
.pick{display:flex;gap:6px;flex-wrap:wrap}
select,.btn{font:500 .78rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.btn{cursor:pointer}
.status{position:fixed;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top,0px));
  font:500 .75rem var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:calc(100% - 32px);text-align:center}
.status.err{border-color:var(--warn);color:var(--warn)}
.dock{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;max-height:48vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;backdrop-filter:blur(8px)}
.frames{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.frame{flex:0 0 auto;font:500 .66rem var(--mono);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:5px;padding:4px 6px;cursor:pointer;font-variant-numeric:tabular-nums}
.frame[aria-pressed="true"]{border-color:var(--accent);background:rgba(79,210,232,.12)}
.frame.newest{border-color:var(--live)}
.row{display:grid;grid-template-columns:5.6rem 1fr 3rem;align-items:center;gap:8px;font-size:.75rem}
.row label{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.64rem}
.row output{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.scale{display:flex;height:8px;border-radius:2px;overflow:hidden}
.scale i{flex:1}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:3px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{font:500 .7rem var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.btns button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.credit{font-size:.6rem;color:var(--muted)}
.credit a{color:var(--muted)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<header>
  <div class="brand">
    <h1><i class="dot" aria-hidden="true"></i>Live <span>Radar Stack</span></h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div class="pick">
    <label for="place" hidden>Place</label>
    <select id="place"></select>
    <label for="zoom" hidden>View size</label>
    <select id="zoom"><option value="7">Close</option><option value="6">Wide</option></select>
    <button class="btn" id="locate">My location</button>
  </div>
</header>
<div class="status" id="status" hidden></div>

<div class="dock">
  <div class="frames" id="frames" aria-label="Radar frames, oldest at the bottom of the stack"></div>
  <div class="row"><label for="gap">Layer gap</label><input id="gap" type="range" min="1" max="20" value="5"><output id="gapv">5</output></div>
  <div class="row"><label for="min">Min dBZ</label><input id="min" type="range" min="10" max="55" value="20"><output id="minv">20</output></div>
  <div>
    <div class="scale" id="scale"></div>
    <div class="ticks"><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70 dBZ</span></div>
  </div>
  <div class="btns">
    <button id="latest" aria-pressed="false">Latest only</button>
    <button id="tall" aria-pressed="true">Height = intensity</button>
    <button id="spin" aria-pressed="false">Auto-rotate</button>
    <button id="reset">Reset view</button>
    <button id="refresh">Refresh now</button>
  </div>
  <div class="credit">Radar: <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a> (personal use) · Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> · Each layer is one 10-minute frame, oldest at the bottom.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ---------- settings ---------- */
const API='https://api.rainviewer.com/public/weather-maps.json';
const BASEMAP=(z,x,y)=>`https://${'abcd'[(x+y)%4]}.basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png`;
const TILES=3,B=6;              // 3x3 tiles of 256px, 6px per block -> 128x128 grid
const REFRESH_MS=5*60*1000;
const PLACES=[
  ['Brisbane',-27.47,153.03],['Gold Coast',-28.0,153.4],['Toowoomba',-27.56,151.95],['Bundaberg',-24.87,152.35],
  ['Rockhampton',-23.38,150.51],['Emerald',-23.52,148.16],['Mackay',-21.14,149.19],['Townsville',-19.26,146.82],
  ['Cairns',-16.92,145.77],['Mount Isa',-20.73,139.49],['Sydney',-33.87,151.21],['Yeoval NSW',-32.75,148.65],
  ['Melbourne',-37.81,144.96],['Adelaide',-34.93,138.6],['Perth',-31.95,115.86],['Darwin',-12.46,130.84],['Hobart',-42.88,147.33]
];
/* RainViewer "Universal Blue" rain colours (scheme 2), dBZ -> RRGGBB */
const UB={'-10':'636159','-9':'66635a','-8':'69665c','-7':'6c685d','-6':'6f6b5f','-5':'726e61','-4':'757062','-3':'787364','-2':'7c7565','-1':'7f7867','0':'827b69','1':'857d6a','2':'88806c','3':'8b826d','4':'8e856f','5':'928871','6':'9e9375','7':'aa9e79','8':'b6a97e','9':'c2b482','10':'cec087','11':'d2c48b','12':'d6c88f','13':'dacc93','14':'ded097','15':'88ddee','16':'6cd1eb','17':'51c5e8','18':'36bae5','19':'1baee2','20':'00a3e0','21':'009ad5','22':'0091ca','23':'0088bf','24':'007fb4','25':'0077aa','26':'0070a3','27':'00699c','28':'006295','29':'005b8e','30':'005588','31':'005180','32':'004e78','33':'004a70','34':'004768','35':'ffee00','36':'ffe000','37':'ffd200','38':'ffc500','39':'ffb700','40':'ffaa00','41':'ff9f00','42':'ff9500','43':'ff8b00','44':'ff8100','45':'ff4400','46':'f23600','47':'e62800','48':'d91b00','49':'cd0d00','50':'c10000','51':'a80000','52':'8f0000','53':'760000','54':'5d0000','55':'ffaaff','56':'ff9fff','57':'ff95ff','58':'ff8bff','59':'ff81ff','60':'ff77ff','61':'ff6cff','62':'ff62ff','63':'ff58ff','64':'ff4eff','65':'ffffff'};
const UBLIST=Object.entries(UB).map(([d,h])=>[+d,parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]);
const EXACT=new Map(UBLIST.map(([d,r,g,b])=>[(r<<16)|(g<<8)|b,d]));
function toDbz(r,g,b){
  const e=EXACT.get((r<<16)|(g<<8)|b);if(e!==undefined)return e;
  let best=null,bd=900;                       // tolerate small colour drift
  for(const[d,R,G,BB]of UBLIST){const dd=(r-R)**2+(g-G)**2+(b-BB)**2;if(dd<bd){bd=dd;best=d}}
  return best;
}
/* display colours (RadarScope-like) */
const STOPS=[[10,[120,120,120]],[18,[92,157,174]],[20,[39,169,67]],[25,[24,131,35]],[30,[35,115,8]],[33,[155,191,3]],[35,[244,243,0]],[40,[204,188,0]],[41,[238,138,1]],[49,[196,104,8]],[50,[249,35,11]],[58,[148,39,28]],[60,[200,133,169]],[65,[196,67,134]],[66,[154,36,224]],[72,[105,24,179]]];
function col(z){
  if(z<=STOPS[0][0])return STOPS[0][1];
  for(let i=1;i<STOPS.length;i++){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i];if(z<=b){const t=(z-a)/(b-a);return ca.map((v,k)=>v+(cb[k]-v)*t)}}
  return STOPS[STOPS.length-1][1];
}
const $=id=>document.getElementById(id);
for(let z=20;z<70;z++){const i=document.createElement('i');i.style.background=`rgb(${col(z).map(Math.round)})`;$('scale').appendChild(i)}
function status(msg,err){const s=$('status');if(!msg){s.hidden=true;return}s.hidden=false;s.textContent=msg;s.classList.toggle('err',!!err)}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- 3D scene ---------- */
const canvas=$('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06090d);
const camera=new THREE.PerspectiveCamera(45,1,0.5,4000);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.495;controls.minDistance=15;controls.maxDistance=600;controls.autoRotateSpeed=1.2;
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x1a1408,0.8));
const sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(-60,140,90);scene.add(sun);
const box=new THREE.BoxGeometry(0.96,1,0.96);box.translate(0,0.5,0);
const tmp=new THREE.Object3D(),c=new THREE.Color();
const N=TILES*256/B;           // grid size (128)
let world=null,layers=[],marker=null;
const st={gap:5,min:20,tall:true,latest:false};

function clearWorld(){
  if(!world)return;
  world.traverse(o=>{if(o.geometry&&o.geometry!==box)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}});
  scene.remove(world);world=null;layers=[];
}
function buildWorld(frames,baseCanvas,centre){
  const keep=layers.map(l=>l.on);
  clearWorld();world=new THREE.Group();scene.add(world);
  if(baseCanvas){const tex=new THREE.CanvasTexture(baseCanvas);
    const g=new THREE.Mesh(new THREE.PlaneGeometry(N,N),new THREE.MeshBasicMaterial({map:tex}));g.rotation.x=-Math.PI/2;g.position.y=-0.4;world.add(g)}
  const edgeG=new THREE.EdgesGeometry(new THREE.PlaneGeometry(N,N));
  frames.forEach((f,i)=>{
    const mesh=new THREE.InstancedMesh(box,new THREE.MeshLambertMaterial(),Math.max(1,f.cells.length));
    mesh.setColorAt(0,c.set(0));
    const newest=i===frames.length-1;
    const edge=new THREE.LineSegments(edgeG,new THREE.LineBasicMaterial({color:newest?0xff5a5a:0x4fd2e8,transparent:true,opacity:newest?.7:.25}));
    edge.rotation.x=-Math.PI/2;
    const grp=new THREE.Group();grp.add(mesh,edge);world.add(grp);
    layers.push({f,mesh,grp,on:keep.length===frames.length?keep[i]:true});
  });
  // centre marker: a thin pole at the chosen place
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,1,8),new THREE.MeshBasicMaterial({color:0xffffff}));
  pole.position.set(centre.x-N/2,0,centre.y-N/2);world.add(pole);marker=pole;
  renderChips();rebuild();
}
function rebuild(){
  const last=layers.length-1;
  layers.forEach((ly,i)=>{
    const vis=ly.on&&(!st.latest||i===last);
    ly.grp.position.y=st.latest?0:i*st.gap;ly.grp.visible=vis;
    let n=0;
    for(const p of ly.f.cells){
      if(p[2]<st.min)continue;
      const h=st.tall?0.4+Math.max(0,p[2]-10)/60*(st.latest?10:4):0.8;
      tmp.position.set(p[0]-N/2+0.5,0,p[1]-N/2+0.5);tmp.scale.set(1,h,1);tmp.updateMatrix();
      ly.mesh.setMatrixAt(n,tmp.matrix);
      const[r,g,b]=col(p[2]);ly.mesh.setColorAt(n,c.setRGB(r/255,g/255,b/255).convertSRGBToLinear());n++;
    }
    ly.mesh.count=n;ly.mesh.instanceMatrix.needsUpdate=true;if(ly.mesh.instanceColor)ly.mesh.instanceColor.needsUpdate=true;
  });
  if(marker){const top=st.latest?12:last*st.gap+6;marker.scale.y=top;marker.position.y=top/2-0.4}
}
function renderChips(){
  const fr=$('frames');fr.innerHTML='';
  layers.slice().reverse().forEach((ly,ri)=>{
    const i=layers.length-1-ri;
    const b=document.createElement('button');b.className='frame'+(i===layers.length-1?' newest':'');b.setAttribute('aria-pressed',ly.on);
    b.textContent=new Date(ly.f.time*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    b.title=i===layers.length-1?'Newest frame (top layer)':'';
    b.onclick=()=>{ly.on=!ly.on;b.setAttribute('aria-pressed',ly.on);rebuild()};
    fr.appendChild(b);
  });
}
function home(){
  const narrow=innerWidth<600,top=st.latest?0:(layers.length-1)*st.gap;
  camera.position.set(-N*0.55,N*(narrow?2.0:0.95)+top*0.6,N*(narrow?2.3:1.2));
  controls.target.set(0,top/2-(narrow?N*0.3:0),0);controls.update();
}

/* ---------- live data ---------- */
function tileXY(lat,lon,z){const n=2**z,r=lat*Math.PI/180;return{x:(lon+180)/360*n,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n}}
function loadImage(url){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=url})}
async function mosaic(urlFor,tx0,ty0){
  const cv=document.createElement('canvas');cv.width=cv.height=TILES*256;const ctx=cv.getContext('2d',{willReadFrequently:true});
  const jobs=[];
  for(let j=0;j<TILES;j++)for(let i=0;i<TILES;i++)jobs.push(loadImage(urlFor(tx0+i,ty0+j)).then(im=>{if(im)ctx.drawImage(im,i*256,j*256)}));
  await Promise.all(jobs);return cv;
}
function gridFrom(cv){
  let d;
  try{d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data}
  catch(e){throw new Error('The browser blocked reading the radar tiles. Open this page from its web address (for example GitHub Pages), not as a file.')}
  const W=cv.width,g=new Int16Array(N*N).fill(-999),vals=[];
  for(let by=0;by<N;by++)for(let bx=0;bx<N;bx++){
    vals.length=0;
    for(let y=by*B;y<by*B+B;y++)for(let x=bx*B;x<bx*B+B;x++){const o=(y*W+x)*4;if(d[o+3]<128)continue;const z=toDbz(d[o],d[o+1],d[o+2]);if(z!==null)vals.push(z)}
    if(vals.length<B*B*0.3)continue;
    vals.sort((a,b)=>a-b);g[by*N+bx]=vals[Math.min(vals.length-1,Math.floor(vals.length*0.7))];
  }
  const cells=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const z=g[y*N+x];if(z>-999)cells.push([x,y,z])}
  return cells;
}
let busy=false,lastKey='',timer=null;
async function update(force){
  if(busy)return;busy=true;
  const [name,lat,lon]=current();const z=+$('zoom').value;
  try{
    status(layers.length?null:'Fetching live radar…');
    const res=await fetch(API,{cache:'no-store'});
    if(!res.ok)throw new Error('RainViewer did not answer ('+res.status+'). Try again in a minute.');
    const info=await res.json();
    const past=(info.radar&&info.radar.past)||[];
    if(!past.length)throw new Error('RainViewer returned no radar frames right now.');
    const key=`${name}|${z}|${past.at(-1).time}`;
    if(!force&&key===lastKey){stamp(past.at(-1).time);busy=false;return}
    const t=tileXY(lat,lon,z),tx0=Math.floor(t.x-TILES/2+0.5)-0,ty0=Math.floor(t.y-TILES/2+0.5);
    const centre={x:(t.x-tx0)*256/B,y:(t.y-ty0)*256/B};
    status(`Loading ${past.length} frames for ${name}…`);
    const base=await mosaic((x,y)=>BASEMAP(z,x,y),tx0,ty0);
    const frames=[];
    for(let k=0;k<past.length;k++){
      const p=past[k];
      const cv=await mosaic((x,y)=>`${info.host}${p.path}/256/${z}/${x}/${y}/2/0_0.png`,tx0,ty0);
      frames.push({time:p.time,cells:gridFrom(cv)});
      status(`Loading frames ${k+1}/${past.length}…`);
    }
    let baseOK=true;try{base.getContext('2d').getImageData(0,0,1,1)}catch(e){baseOK=false}
    const first=!layers.length||!lastKey.startsWith(`${name}|${z}|`);
    buildWorld(frames,baseOK?base:null,centre);
    if(first)home();
    lastKey=key;stamp(past.at(-1).time);
    const total=frames.reduce((a,f)=>a+f.cells.length,0);
    status(total?null:`No rain on radar around ${name} right now.`);
  }catch(e){status(e.message,true)}
  busy=false;
}
function stamp(t){
  const ago=Math.round((Date.now()/1000-t)/60);
  $('meta').textContent=`${current()[0]} · newest ${new Date(t*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} (${ago} min ago)`;
}
function current(){const v=$('place').value;if(v==='me'&&myLoc)return['My location',myLoc[0],myLoc[1]];return PLACES[+v]||PLACES[0]}
let myLoc=null;

/* ---------- controls ---------- */
PLACES.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p[0];$('place').appendChild(o)});
const meOpt=document.createElement('option');meOpt.value='me';meOpt.textContent='My location';meOpt.hidden=true;$('place').appendChild(meOpt);
const saved=store.get('lrs-place');if(saved&&saved!=='me'&&PLACES[+saved])$('place').value=saved;
const savedZ=store.get('lrs-zoom');if(savedZ)$('zoom').value=savedZ;
$('place').onchange=()=>{store.set('lrs-place',$('place').value);update(true)};
$('zoom').onchange=()=>{store.set('lrs-zoom',$('zoom').value);update(true)};
$('locate').onclick=()=>{
  if(!navigator.geolocation){status('This browser cannot share your location.',true);return}
  status('Finding your location…');
  navigator.geolocation.getCurrentPosition(p=>{myLoc=[p.coords.latitude,p.coords.longitude];meOpt.hidden=false;$('place').value='me';update(true)},
    ()=>status('Location was not shared. Pick a place from the list instead.',true),{timeout:10000});
};
$('gap').oninput=()=>{st.gap=+$('gap').value;$('gapv').textContent=st.gap;rebuild()};
$('min').oninput=()=>{st.min=+$('min').value;$('minv').textContent=st.min;rebuild()};
$('tall').onclick=()=>{st.tall=!st.tall;$('tall').setAttribute('aria-pressed',st.tall);rebuild()};
$('latest').onclick=()=>{st.latest=!st.latest;$('latest').setAttribute('aria-pressed',st.latest);rebuild();home()};
$('spin').onclick=()=>{controls.autoRotate=!controls.autoRotate;$('spin').setAttribute('aria-pressed',controls.autoRotate)};
$('reset').onclick=home;
$('refresh').onclick=()=>update(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)update(false)});

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
camera.position.set(-60,180,200);controls.update();
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
update(true);timer=setInterval(()=>update(false),REFRESH_MS);
</script>
</body>
</html>
